<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{name}}</h1>
       <table border ="1">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            {% for person in Persons %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{person.name}}</td>

                <td>
                {{person.age}}
                {% if person.age <= 18 %}
                Underage
                {% elif person.age <= 40 %}
                Middle Age
                {% elif person.age >= 40 %}
                Old
                {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
       </table>      
</body>
</html>
